<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Campus placement portal for students and placement coordinators." />
    <title>NexPlacement | Campus Placement Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <button class="brand" data-action="navigate" data-tab="drives" aria-label="NexPlacement home">
          <span class="brand-icon">N</span>
          <span>NexPlacement</span>
        </button>
        <nav class="main-nav" aria-label="Main navigation">
          <button data-action="navigate" data-tab="drives">Campus Drives</button>
          <button data-action="navigate" data-tab="applications">My Applications <span class="nav-count" id="application-count"></span></button>
          <button data-action="navigate" data-tab="interviews">Interview Slots <span class="nav-dot" id="interview-dot" hidden></span></button>
          <button data-action="navigate" data-tab="resume">Resume &amp; ATS</button>
          <button data-action="navigate" data-tab="tpo" id="tpo-navigation" hidden>TPO Console</button>
        </nav>
        <div class="topbar-actions">
          <button class="button button-muted deploy-button" data-action="open-deploy">Deploy Guide</button>
          <div class="role-switch" aria-label="Choose user role">
            <button data-action="role" data-role="student">Student</button>
            <button data-action="role" data-role="coordinator">TPO Officer</button>
          </div>
          <button class="avatar-button" id="student-avatar" data-action="navigate" data-tab="resume" title="Student profile">
            <img src="/images/student_avatar_1793863944480.jpg" alt="" />
          </button>
          <img class="avatar-image" id="coordinator-avatar" src="/images/director_avatar_1793863944316.jpg" alt="Placement director" hidden />
        </div>
      </div>
    </header>

    <div class="toast" id="toast" role="status" hidden></div>
    <main class="page-container" id="portal-content" aria-live="polite"></main>

    <footer class="footer">
      <strong>NexPlacement</strong>
      <span>University Training &amp; Placement Cell</span>
      <button class="text-button" data-action="open-deploy">Deployment guide</button>
      <span>Node.js &amp; MongoDB Ready · Batch of 2026</span>
    </footer>

    <script type="module" src="/src/app.js"></script>
  </body>
</html>
